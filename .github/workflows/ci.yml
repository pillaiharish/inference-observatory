name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod declares the minimum Go version (currently 1.27).
          # setup-go installs that line on the runner and enables
          # module caching.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt would reformat:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./cmd/observatory

  # Static validation of the telemetry stack configuration.
  # Does NOT start any containers or require a GPU.
  telemetry-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shell syntax check (preflight)
        run: bash -n scripts/preflight-gpu.sh

      - name: shell syntax check (validate)
        run: bash -n scripts/validate-telemetry.sh

      - name: Prometheus JSON parser fixture tests
        run: ./tests/test-validate-telemetry-parser.sh

      - name: Compose config validates
        run: |
          docker compose \
            -f deploy/compose.yaml \
            --env-file deploy/.env.example \
            config >/dev/null

      - name: Prometheus config validates
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml